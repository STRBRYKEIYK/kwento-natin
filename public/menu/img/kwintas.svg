  <rect x="64" y="62" width="1072" height="776" rx="20" fill="none" stroke="#9f7932" stroke-opacity="0.26" stroke-width="1.2" />

  <!-- Fine Archival Corner Registration Marks -->
  <g stroke="#9a7531" stroke-opacity="0.42" stroke-width="1.2">
    <path d="M98 124 V96 H126" fill="none" />
    <path d="M1102 124 V96 H1074" fill="none" />
    <path d="M98 776 V804 H126" fill="none" />
    <path d="M1102 776 V804 H1074" fill="none" />
  </g>

