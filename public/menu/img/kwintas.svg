    <polygon points="0,-104 92,-52 92,52 0,104 -92,52 -92,-52" fill="none" stroke="url(#kwGoldBright)" stroke-width="11.5" stroke-linejoin="round" />
    <polygon points="0,-90 79,-45 79,45 0,90 -79,45 -79,-45" fill="none" stroke="url(#kwGoldSheen)" stroke-width="4.2" stroke-linejoin="round" />

