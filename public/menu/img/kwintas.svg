    <path d="M358 124 C382 222 446 286 502 324" stroke="url(#kwChainGrad)" stroke-width="3.2" stroke-dasharray="5 5" />
    <path d="M622 124 C598 214 552 284 508 324" stroke="url(#kwChainGrad)" stroke-width="2.6" stroke-dasharray="5 5" opacity="0.72" />
    <!-- Right Chain to Hexagonal Pendant -->
    <path d="M578 124 C606 218 652 286 694 324" stroke="url(#kwChainGrad)" stroke-width="2.6" stroke-dasharray="5 5" opacity="0.72" />
    <path d="M842 124 C818 222 754 286 700 324" stroke="url(#kwChainGrad)" stroke-width="3.2" stroke-dasharray="5 5" />
  </g>

