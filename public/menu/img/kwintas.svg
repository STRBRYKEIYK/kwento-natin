  <!-- Subtle Paired Labels Beneath Pendants -->
  <text x="505" y="616" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="#7c5c26">JERSEY · OVAL</text>
  <text x="697" y="616" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="#7c5c26">KEITH · HEXAGON</text>

  <!-- Editorial Title & Dedication -->
  <text x="600" y="704" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="54" letter-spacing="6" fill="#231c15">ANG KWINTAS NATIN</text>
  <line x1="406" y1="730" x2="794" y2="730" stroke="#a88035" stroke-opacity="0.48" stroke-width="1.2" />
  <text x="600" y="770" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#6d563c">11:11 · DALAWANG HUGIS, ISANG PUSO</text>
