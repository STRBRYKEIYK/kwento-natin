    <path d="M-8 -118 C-11 -134 -6 -144 0 -144 C6 -144 11 -134 8 -118 Z" fill="url(#kwGoldBright)" stroke="#7c5719" stroke-width="1.3" />
    <circle cx="0" cy="-114" r="6.5" fill="none" stroke="url(#kwGoldBright)" stroke-width="3.5" />

