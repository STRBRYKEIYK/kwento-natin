      <path d="M-10 -80 C28 -80 46 -56 46 -30 C46 -6 24 8 -10 8" />
      <path d="M-10 8 C30 8 50 28 50 52 C50 76 24 88 -16 86 C-42 84 -49 62 -46 38" />
      <path d="M-46 -26 C-46 -58 -32 -78 -10 -80" />
    </g>
    <!-- Crisp Specular Highlight -->
