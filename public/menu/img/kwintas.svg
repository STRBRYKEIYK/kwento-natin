    <rect x="-64" y="-102" width="128" height="204" rx="64" fill="none" stroke="#7c5719" stroke-opacity="0.28" stroke-width="15" transform="translate(2 4)" />
    <rect x="-64" y="-102" width="128" height="204" rx="64" fill="none" stroke="url(#kwGoldBright)" stroke-width="11.5" />
    <rect x="-53" y="-91" width="106" height="182" rx="53" fill="none" stroke="url(#kwGoldSheen)" stroke-width="4.2" />

