    <g fill="none" stroke="url(#kwGoldBright)" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-18" y1="-78" x2="-18" y2="78" />
      <path d="M-74 0 H68" />
      <path d="M-18 -66 C26 -66 54 -44 54 -18 C54 -4 36 0 -18 0" />
      <path d="M-18 0 C32 0 58 18 58 40 C58 62 28 74 -18 72" />
      <line x1="68" y1="-38" x2="68" y2="38" />
    </g>
    <!-- Crisp Specular Highlight -->
    <polygon points="0,-104 92,-52 92,52 0,104 -92,52 -92,-52" fill="none" stroke="#fff9e2" stroke-opacity="0.6" stroke-width="1.6" stroke-linejoin="round" />
