  <path d="M274 794 V358 C274 186 418 102 600 102 C782 102 926 186 926 358 V794" fill="url(#kwHalo)" stroke="#a98238" stroke-opacity="0.22" stroke-width="1.4" />
  <path d="M298 794 V362 C298 206 432 126 600 126 C768 126 902 206 902 362 V794" fill="none" stroke="#a98238" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="3 9" />

