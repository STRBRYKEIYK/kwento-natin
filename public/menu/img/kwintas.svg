<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="11:11 ANG KWINTAS NATIN — DALAWANG KULAY-GINTONG MONOGRAM NA KWINTAS, ISANG OVAL AT ISANG HEXAGON, PARA SA CHICAAAA KO.">
