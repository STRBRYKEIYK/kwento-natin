<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="3:33 PM A LEGO HOUSE — ISANG MUNTING TAHANANG BINUO MULA SA MALILIIT NA PIECES, PARA SA CHICAAA KO.">
